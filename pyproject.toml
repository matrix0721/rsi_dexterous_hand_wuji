[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-imagine"
version = "1.1.0"
description = "Observation-driven imagination and feedback for UR5e and Wuji hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
robot = ["ur-rtde>=1.6,<2", "wujihandpy"]
camera = ["pyrealsense2>=2.54"]
physics = ["mujoco>=3.2,<4"]

[project.scripts]
wuji-imagine = "wujiimagine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
